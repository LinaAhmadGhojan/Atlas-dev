    :root {
      --bg: #eaefeb;
      --surface: #ffffff;
      --surface-2: #f4f6f4;
      --text: #0f0f0f;
      --muted: #6f736d;
      --accent: #fed000;
      --border: rgba(15, 15, 15, .14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, .78);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .title-wrap {
      flex: 1;
    }

    .title-wrap h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .title-wrap p {
      color: var(--muted);
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all .2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      display: block;
      flex-shrink: 0;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-lang {
      background: var(--accent);
      color: #0f1115;
      font-weight: 700;
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
    }

    .main-content {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .hero-section {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slider-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(52, 211, 165, 0.1), rgba(254, 208, 0, 0.08));
      border: 1px solid var(--border);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slider-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: 20px;
      background: var(--surface);
    }

    .slider-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .slider-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all .2s;
    }

    .slider-btn:hover {
      background: var(--surface-2);
      border-color: var(--accent);
    }

    .slider-counter {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      min-width: 60px;
      text-align: center;
    }

    .info-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .badge {
      display: inline-flex;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(254, 208, 0, 0.4);
      background: rgba(254, 208, 0, 0.1);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      width: fit-content;
    }

    .desc {
      font-size: 16px;
      color: #1f2329;
      line-height: 1.8;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(254, 208, 0, 0.12);
      color: #f4ce2a;
      border: 1px solid rgba(254, 208, 0, 0.28);
      font-size: 13px;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .hero-section {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .main-content {
        padding: 24px 16px;
      }

      .slider-wrapper {
        aspect-ratio: 1;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .actions {
        width: 100%;

      .btn {

        padding: 9px 12px;
      }

      .title-wrap h1 {

      }

      .hero-section {
        gap: 16px;
      }

      .info-section {
        gap: 16px;
      }

      .desc {
        font-size: 15px;
      }
    }

        images: ['lina-ahmad-ghojan/5-Rent-Management/1.png', 'lina-ahmad-ghojan/5-Rent-Management/Scene 1.png', 'lina-ahmad-ghojan/5-Rent-Management/Scene 4.png', 'lina-ahmad-ghojan/5-Rent-Management/Scene 5.png', 'lina-ahmad-ghojan/5-Rent-Management/Scene 7.png', 'lina-ahmad-ghojan/5-Rent-Management/Scene 8.png'],
        tags: ['Laravel', 'Vue 3', 'PostgreSQL']
      },
      transithub: {

          en: 'Smart transport and fleet management platform with live driver tracking, route optimization, fuel monitoring, maintenance scheduling, and trip analytics.'
        },
        images: ['lina-ahmad-ghojan/6-smart%20transport%20platform/1.png', 'lina-ahmad-ghojan/6-smart%20transport%20platform/01.png', 'lina-ahmad-ghojan/6-smart%20transport%20platform/02.png', 'lina-ahmad-ghojan/6-smart%20transport%20platform/03.png', 'lina-ahmad-ghojan/6-smart%20transport%20platform/04.png', 'lina-ahmad-ghojan/6-smart%20transport%20platform/05.png', 'lina-ahmad-ghojan/6-smart%20transport%20platform/Scene 1.png'],
        tags: ['Laravel', 'Vue 3', 'Flutter']
      },
      educare: {
        name: { ar: 'EduCare', en: 'EduCare' },
        type: { ar: 'إدارة تعليم', en: 'Education' },
        details: {
          ar: 'نظام شامل لإدارة المدارس مع سجلات الطلاب والحضور والدرجات والرسوم والواجبات والفعاليات والتواصل مع أولياء الأمور.',
          en: 'Comprehensive school management system with student records, attendance tracking, grade management, billing, homework, events, and parent communication portal.'
        },
        images: ['lina-ahmad-ghojan/8-school/1.png', 'lina-ahmad-ghojan/8-school/Login.png', 'lina-ahmad-ghojan/8-school/Sessions.png', 'lina-ahmad-ghojan/8-school/Teacher.png', 'lina-ahmad-ghojan/8-school/Home Work.png', 'lina-ahmad-ghojan/8-school/Events.png', 'lina-ahmad-ghojan/8-school/Finance_fees head.png', 'lina-ahmad-ghojan/8-school/noticeboard.png'],
        tags: ['Laravel', 'Vue 3', 'MySQL']
      },
      wareflow: {
        name: { ar: 'WareFlow', en: 'WareFlow' },
        type: { ar: 'مخزون ومستودعات', en: 'Inventory Management' },
        details: {
          ar: 'نظام متكامل لإدارة المخزون والمستودعات مع تتبع الأصول والأدوات وتقارير GRN وتخصيص المواد حسب المشروع ومرشحات متقدمة ودعم الباركود.',
          en: 'Full inventory and warehouse management system with asset tracking, tools management, GRN reporting, project-based item allocation, filters, and barcode scanning support.'
        },
        images: ['lina-ahmad-ghojan/9-Inventory-Management-System-/05 Dashboard.png', 'lina-ahmad-ghojan/9-Inventory-Management-System-/1.png', 'lina-ahmad-ghojan/9-Inventory-Management-System-/Assets.png', 'lina-ahmad-ghojan/9-Inventory-Management-System-/All Items.png', 'lina-ahmad-ghojan/9-Inventory-Management-System-/GRN Report.png', 'lina-ahmad-ghojan/9-Inventory-Management-System-/Project.png', 'lina-ahmad-ghojan/9-Inventory-Management-System-/Request.png'],
        tags: ['Laravel', 'Vue 3', 'PostgreSQL']
      },
      staffhub: {
        name: { ar: 'StaffHub', en: 'StaffHub' },
        type: { ar: 'موارد بشرية', en: 'HR Dashboard' },
        details: {
          ar: 'لوحة موارد بشرية لإدارة حضور الموظفين والرواتب والرسائل وتحليلات الأقسام للشركات النامية.',
          en: 'HR management dashboard featuring employee attendance tracking, payroll processing, messaging, and department analytics built for growing teams.'
        },
        images: ['lina-ahmad-ghojan/10-HR Management Dashboard (Community)/payroll.png', 'lina-ahmad-ghojan/10-HR Management Dashboard (Community)/employee attendance.png', 'lina-ahmad-ghojan/10-HR Management Dashboard (Community)/message.png', 'lina-ahmad-ghojan/10-HR Management Dashboard (Community)/message-1.png'],
        tags: ['Laravel', 'Vue 3', 'MySQL']
      }
    };

    const projectAliases = {
      shopnest: 'ShopNest',
      bahasaku: 'bahasaku',
      '2bahasaku': 'bahasaku'
    };

    const catalogKeyByLower = Object.keys(projectCatalog).reduce((acc, key) => {
      acc[key.toLowerCase()] = key;
      return acc;
    }, {});

    function resolveProjectKey(rawKey) {
      if (!rawKey) return null;
      const trimmed = rawKey.trim();
      if (projectCatalog[trimmed]) return trimmed;

      const normalized = trimmed.toLowerCase().replace(/\s+/g, '');
      if (projectAliases[normalized]) return projectAliases[normalized];
      if (catalogKeyByLower[normalized]) return catalogKeyByLower[normalized];

      const withoutLeadingDigits = normalized.replace(/^\d+/, '');
      if (projectAliases[withoutLeadingDigits]) return projectAliases[withoutLeadingDigits];
      if (catalogKeyByLower[withoutLeadingDigits]) return catalogKeyByLower[withoutLeadingDigits];

      return null;
    }

    let currentImageIndex = 0;
    let currentProject = null;

    const params = new URLSearchParams(window.location.search);
    const projectKey = resolveProjectKey(params.get('project'));
    const storedLang = localStorage.getItem('atlas-lang') || 'ar';
    let currentLang = params.get('lang') || storedLang;
    if (!translations[currentLang]) currentLang = 'ar';

    function buildWhatsAppLink(message) {
      return `https://wa.me/971524859625?text=${encodeURIComponent(message)}`;
    }

    function getProjectPageUrl(key, lang) {
      const next = new URL(`${SITE_URL}/project-details.html`);
      if (key) next.searchParams.set('project', key);
      if (lang === 'en') next.searchParams.set('lang', 'en');
      return next.toString();
    }

    function buildProjectSeo(project, lang, key) {
      if (!project || !key) {
        return {
          title: translations[lang].pageTitle,
          description: translations[lang].defaultDescription,
          canonical: `${SITE_URL}/`,
          robots: 'noindex, follow',
          image: `${SITE_URL}/logo/logo4.png`,
          imageAlt: 'AtlasDev logo'
        };
      }

      const title = lang === 'ar'
        ? `${project.name.ar} | ${project.type.ar} | AtlasDev`
        : `${project.name.en} | ${project.type.en} | AtlasDev`;
      const description = lang === 'ar'
        ? `${project.details.ar} تقنيات التنفيذ: ${project.tags.join('، ')}.`
        : `${project.details.en} Delivery stack: ${project.tags.join(', ')}.`;
      const imagePath = project.images[0].replace(/ /g, '%20');

      return {
        title,
        description,
        canonical: getProjectPageUrl(key, lang),
        robots: 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1',
        image: `${SITE_URL}/${imagePath}`,
        imageAlt: `${project.name[lang]} ${project.type[lang]}`
      };
    }

    function buildProjectSchema(project, lang, key, seo) {
      if (!project || !key) return null;

      return {
        '@context': 'https://schema.org',
        '@graph': [
          {
            '@type': 'Organization',
            '@id': `${SITE_URL}/#organization`,
            name: 'AtlasDev',
            url: `${SITE_URL}/`,
            logo: `${SITE_URL}/logo/logo4.png`,
            email: 'info@atlasdev.tech',
            telephone: '+971524859625',
            availableLanguage: ['ar', 'en']
          },
          {
            '@type': 'BreadcrumbList',
            '@id': `${seo.canonical}#breadcrumbs`,
            itemListElement: [
              {
                '@type': 'ListItem',
                position: 1,
                name: 'AtlasDev',
                item: `${SITE_URL}/`
              },
              {
                '@type': 'ListItem',
                position: 2,
                name: lang === 'ar' ? 'المشاريع' : 'Projects',
                item: `${SITE_URL}/${lang === 'en' ? '?lang=en' : ''}#projects`
              },
              {
                '@type': 'ListItem',
                position: 3,
                name: project.name[lang],
                item: seo.canonical
              }
            ]
          },
          {
            '@type': 'CreativeWork',
            '@id': `${seo.canonical}#case-study`,
            name: project.name[lang],
            headline: seo.title,
            description: seo.description,
            inLanguage: lang,
            image: project.images.map(image => `${SITE_URL}/${image.replace(/ /g, '%20')}`),
            genre: project.type[lang],
            keywords: project.tags.join(', '),
            author: { '@id': `${SITE_URL}/#organization` },
            publisher: { '@id': `${SITE_URL}/#organization` },
            mainEntityOfPage: seo.canonical,
            url: seo.canonical
          }
        ]
      };
    }

    function applyProjectSeo(project, lang, key) {
      const seo = buildProjectSeo(project, lang, key);
      const ogLocale = lang === 'ar' ? 'ar_AE' : 'en_US';

      document.title = seo.title;
      metaDescription.setAttribute('content', seo.description);
      metaRobots.setAttribute('content', seo.robots);
      canonicalLink.setAttribute('href', seo.canonical);
      alternateAr.setAttribute('href', getProjectPageUrl(key, 'ar'));
      alternateEn.setAttribute('href', getProjectPageUrl(key, 'en'));
      alternateDefault.setAttribute('href', getProjectPageUrl(key, 'ar'));
      metaOgTitle.setAttribute('content', seo.title);
      metaOgDescription.setAttribute('content', seo.description);
      metaOgUrl.setAttribute('content', seo.canonical);
      metaOgImage.setAttribute('content', seo.image);
      metaOgImageAlt.setAttribute('content', seo.imageAlt);
      metaOgLocale.setAttribute('content', ogLocale);
      metaTwitterTitle.setAttribute('content', seo.title);
      metaTwitterDescription.setAttribute('content', seo.description);
      metaTwitterImage.setAttribute('content', seo.image);

      const schema = buildProjectSchema(project, lang, key, seo);
      schemaNode.textContent = schema ? JSON.stringify(schema) : '';
    }

    function projectMessage(project, lang) {
      return lang === 'ar'
        ? `مرحباً AtlasDev، أريد مشروع مشابه لـ ${project.name.ar} (${project.type.ar}).`
        : `Hello AtlasDev, I need a project similar to ${project.name.en} (${project.type.en}).`;
    }

    function setUrlLang() {
      const next = new URL(window.location.href);
      next.searchParams.set('lang', currentLang);
      window.history.replaceState({}, '', next);
    }

    function updateSlider() {
      const img = document.getElementById('sliderImage');
      if (img && currentProject) {
        img.src = currentProject.images[currentImageIndex];
        document.getElementById('imageCounter').textContent = `${currentImageIndex + 1} / ${currentProject.images.length}`;
      }
    }

    function nextImage() {
      if (currentProject) {
        currentImageIndex = (currentImageIndex + 1) % currentProject.images.length;
        updateSlider();
      }
    }

    function prevImage() {
      if (currentProject) {
        currentImageIndex = (currentImageIndex - 1 + currentProject.images.length) % currentProject.images.length;
        updateSlider();
      }
    }

    function render() {
      const locale = translations[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('backBtn').textContent = locale.back;
      document.getElementById('waLabel').textContent = locale.wa;
      document.getElementById('langBtn').textContent = locale.langSwitch;

      const project = projectCatalog[projectKey];
      if (!project) {
        applyProjectSeo(null, currentLang, null);
        document.getElementById('projectTitle').textContent = locale.defaultTitle;
        document.getElementById('projectType').textContent = '';
        document.getElementById('contentContainer').style.display = 'none';
        const empty = document.getElementById('emptyState');
        empty.style.display = 'block';
        empty.textContent = locale.invalid;
        document.getElementById('waBtn').style.display = 'none';
        return;
      }

      currentProject = project;
      currentImageIndex = 0;
  applyProjectSeo(project, currentLang, projectKey);

      document.getElementById('projectTitle').textContent = project.name[currentLang];
      document.getElementById('projectType').textContent = project.type[currentLang];

      const container = document.getElementById('contentContainer');
      container.innerHTML = `
        <div class="hero-section">
          <div class="gallery-container">
            <div class="slider-wrapper">
              <img id="sliderImage" class="slider-image" src="${project.images[0]}" alt="${project.name[currentLang]} ${project.type[currentLang]}">
            </div>
            <div class="slider-controls">
              <button class="slider-btn" onclick="prevImage()">←</button>
              <span class="slider-counter" id="imageCounter">1 / ${project.images.length}</span>
              <button class="slider-btn" onclick="nextImage()">→</button>
            </div>
          </div>
          <div class="info-section">
            <span class="badge">${locale.badge}</span>
            <p class="desc">${project.details[currentLang]}</p>
            <div class="tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
          </div>
        </div>
      `;

      document.getElementById('contentContainer').style.display = 'block';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('waBtn').href = buildWhatsAppLink(projectMessage(project, currentLang));
      document.getElementById('waBtn').style.display = 'inline-flex';
      
      localStorage.setItem('atlas-lang', currentLang);
      setUrlLang();
    }

    document.getElementById('langBtn').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      render();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') prevImage();
      if (e.key === 'ArrowLeft') nextImage();
    });

    render();
  </script>
</body>
